<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0071E3"/>
      <stop offset="50%" style="stop-color:#40A9FF"/>
      <stop offset="100%" style="stop-color:#00C7BE"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0.3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0071E3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 背景圆角矩形 -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- 装饰圆环 -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>

  <!-- 数据波形/心电图样式的线条 - 代表市场洞察 -->
  <path d="M 80 256
           L 140 256
           L 170 180
           L 200 320
           L 230 220
           L 260 280
           L 290 160
           L 320 340
           L 350 240
           L 380 260
           L 430 256"
        fill="none"
        stroke="url(#waveGrad)"
        stroke-width="24"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- 灵犀角/犀牛角造型 - 代表"灵犀"品牌 -->
  <path d="M 256 80
           Q 310 140 310 200
           Q 310 280 256 320
           Q 202 280 202 200
           Q 202 140 256 80 Z"
        fill="rgba(255,255,255,0.15)"
        stroke="none"/>

  <!-- 中心钻石/灵犀点 -->
  <circle cx="256" cy="200" r="28" fill="#FFFFFF"/>
  <circle cx="256" cy="200" r="16" fill="#0071E3"/>

  <!-- 下方装饰点 - 代表数据节点 -->
  <circle cx="160" cy="380" r="12" fill="rgba(255,255,255,0.6)"/>
  <circle cx="200" cy="400" r="8" fill="rgba(255,255,255,0.4)"/>
  <circle cx="352" cy="380" r="12" fill="rgba(255,255,255,0.6)"/>
  <circle cx="312" cy="400" r="8" fill="rgba(255,255,255,0.4)"/>

  <!-- 连接线 -->
  <line x1="160" y1="380" x2="256" y2="340" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <line x1="352" y1="380" x2="256" y2="340" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
</svg>