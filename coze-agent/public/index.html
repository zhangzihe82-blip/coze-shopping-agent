<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>灵犀导购 — AI 电商智能购物助手</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: #0071E3;
      --accent-hover: #0077ED;
      --accent-light: #E8F4FD;
      --bg: #F5F5F7;
      --surface: #FFFFFF;
      --surface-secondary: #FAFAFA;
      --text: #1D1D1F;
      --text-secondary: #6E6E73;
      --text-tertiary: #86868B;
      --border: #D2D2D7;
      --border-light: #E8E8ED;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
      --shadow: 0 2px 12px rgba(0,0,0,0.06);
      --shadow-lg: 0 8px 32px rgba(0,0,0,0.08);
      --radius: 20px;
      --radius-sm: 14px;
      --radius-xs: 10px;
      --transition: 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
    }

    /* ─── Nav Bar ─── */
    .navbar {
      background: rgba(255,255,255,0.72);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid rgba(0,0,0,0.06);
      padding: 0 24px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 100;
      flex-shrink: 0;
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 17px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.2px;
      cursor: default;
      user-select: none;
    }

    .nav-logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #FF6B35, #FF8F65);
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      box-shadow: 0 2px 8px rgba(255,107,53,0.25);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-btn {
      height: 32px;
      padding: 0 14px;
      border-radius: 16px;
      border: none;
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: all var(--transition);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-secondary);
    }
    .btn-ghost:hover {
      background: rgba(0,0,0,0.04);
      color: var(--text);
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 2px 8px rgba(0,113,227,0.3);
    }
    .btn-primary:hover {
      background: var(--accent-hover);
      transform: scale(1.02);
      box-shadow: 0 4px 16px rgba(0,113,227,0.4);
    }
    .btn-primary:active {
      transform: scale(0.98);
    }

    /* ─── Main Chat Area ─── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-scroll {
      flex: 1;
      overflow-y: auto;
      scroll-behavior: smooth;
      padding: 32px 16px;
    }
    .chat-scroll::-webkit-scrollbar { width: 4px; }
    .chat-scroll::-webkit-scrollbar-track { background: transparent; }
    .chat-scroll::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.12); border-radius: 2px; }

    /* ─── Welcome Screen ─── */
    .welcome {
      max-width: 640px;
      margin: 0 auto;
      text-align: center;
      padding: 48px 24px 32px;
      animation: fadeUp 0.7s ease;
    }

    .welcome-emoji {
      font-size: 56px;
      margin-bottom: 20px;
      animation: float 3s ease-in-out infinite;
    }

    .welcome h1 {
      font-size: 36px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text);
      margin-bottom: 8px;
    }

    .welcome .subtitle {
      font-size: 18px;
      font-weight: 400;
      color: var(--text-secondary);
      margin-bottom: 32px;
      line-height: 1.5;
    }

    .suggestion-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      max-width: 560px;
      margin: 0 auto;
    }

    .suggestion-card {
      background: var(--surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-xs);
      padding: 14px 16px;
      font-size: 13px;
      color: var(--text);
      cursor: pointer;
      transition: all var(--transition);
      text-align: left;
      font-family: inherit;
      box-shadow: var(--shadow-sm);
      line-height: 1.45;
    }
    .suggestion-card:hover {
      border-color: var(--accent);
      box-shadow: var(--shadow);
      transform: translateY(-1px);
    }
    .suggestion-card:active {
      transform: scale(0.98);
    }
    .suggestion-card .sug-icon {
      display: block;
      font-size: 22px;
      margin-bottom: 6px;
    }

    .feature-row {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 24px;
    }

    .feature-badge {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-tertiary);
      background: rgba(0,0,0,0.03);
      padding: 6px 12px;
      border-radius: 100px;
      letter-spacing: 0.2px;
    }

    /* ─── Message Bubbles ─── */
    .msg-row {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      max-width: 780px;
      margin-left: auto;
      margin-right: auto;
      animation: fadeUp 0.35s ease;
    }
    .msg-row.user { flex-direction: row-reverse; }

    .msg-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }
    .msg-avatar.ai { background: linear-gradient(135deg, #FF6B35, #FF8F65); color: #fff; }
    .msg-avatar.user { background: #0071E3; color: #fff; }

    .msg-bubble {
      max-width: 82%;
      padding: 14px 18px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      line-height: 1.65;
      word-break: break-word;
    }

    .msg-row.ai .msg-bubble {
      background: var(--surface);
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-sm);
      border-bottom-left-radius: 4px;
    }

    .msg-row.user .msg-bubble {
      background: var(--accent);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    /* AI message markdown styling */
    .msg-bubble h1 { font-size: 20px; font-weight: 700; margin: 16px 0 8px; letter-spacing: -0.3px; }
    .msg-bubble h2 { font-size: 17px; font-weight: 600; margin: 14px 0 6px; letter-spacing: -0.2px; }
    .msg-bubble h3 { font-size: 15px; font-weight: 600; margin: 12px 0 4px; }
    .msg-bubble p { margin: 6px 0; }
    .msg-bubble ul, .msg-bubble ol { margin: 8px 0; padding-left: 22px; }
    .msg-bubble li { margin: 4px 0; }
    .msg-bubble strong { font-weight: 600; }
    .msg-row.ai .msg-bubble strong { color: #E55A25; }
    .msg-bubble em { font-style: italic; }
    .msg-bubble table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 13px; border-radius: 8px; overflow: hidden; box-shadow: var(--shadow-sm); }
    .msg-bubble th { background: #F5F5F7; font-weight: 600; padding: 10px 12px; text-align: left; font-size: 12px; color: var(--text-secondary); border-bottom: 1px solid var(--border); }
    .msg-bubble td { padding: 10px 12px; border-bottom: 1px solid var(--border-light); }
    .msg-bubble tr:last-child td { border-bottom: none; }
    .msg-bubble code { background: rgba(0,0,0,0.05); padding: 2px 6px; border-radius: 5px; font-size: 13px; font-family: 'SF Mono', 'Fira Code', monospace; }
    .msg-bubble pre { background: #1D1D1F; color: #F5F5F7; padding: 14px 16px; border-radius: 10px; overflow-x: auto; margin: 10px 0; font-size: 13px; line-height: 1.5; }
    .msg-bubble blockquote { border-left: 3px solid var(--accent); margin: 10px 0; padding: 4px 0 4px 14px; color: var(--text-secondary); background: var(--accent-light); border-radius: 0 6px 6px 0; }
    .msg-bubble hr { border: none; border-top: 1px solid var(--border-light); margin: 14px 0; }

    .typing-dots { display: flex; gap: 5px; padding: 6px 0; }
    .typing-dots span { width: 7px; height: 7px; background: #C7C7CC; border-radius: 50%; animation: dotBounce 1.3s infinite; }
    .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes dotBounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.35; }
      30% { transform: translateY(-5px); opacity: 1; }
    }

    /* ─── Input Bar ─── */
    .input-bar {
      padding: 16px 20px 20px;
      flex-shrink: 0;
    }

    .input-container {
      max-width: 780px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      background: var(--surface);
      border: 1.5px solid var(--border-light);
      border-radius: var(--radius);
      padding: 8px 8px 8px 18px;
      box-shadow: var(--shadow);
      transition: all var(--transition);
    }
    .input-container:focus-within {
      border-color: var(--accent);
      box-shadow: 0 4px 24px rgba(0,113,227,0.12);
    }

    .input-field {
      flex: 1;
      border: none;
      outline: none;
      font-size: 15px;
      font-family: inherit;
      line-height: 1.5;
      resize: none;
      max-height: 130px;
      padding: 6px 0;
      color: var(--text);
      background: transparent;
    }
    .input-field::placeholder { color: #BFBFBF; }

    .send-button {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition);
      box-shadow: 0 2px 8px rgba(0,113,227,0.3);
    }
    .send-button:hover {
      transform: scale(1.06);
      box-shadow: 0 4px 16px rgba(0,113,227,0.45);
    }
    .send-button:active { transform: scale(0.94); }
    .send-button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .input-hint {
      text-align: center;
      font-size: 11px;
      color: var(--text-tertiary);
      margin-top: 8px;
      max-width: 780px;
      margin-left: auto;
      margin-right: auto;
    }

    /* ─── Animations ─── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }

    /* ─── Responsive ─── */
    @media (max-width: 640px) {
      .navbar { padding: 0 14px; height: 48px; }
      .nav-brand { font-size: 15px; }
      .chat-scroll { padding: 20px 12px; }
      .welcome { padding: 32px 12px 20px; }
      .welcome h1 { font-size: 28px; }
      .welcome .subtitle { font-size: 16px; }
      .suggestion-grid { grid-template-columns: 1fr; }
      .msg-bubble { max-width: 90%; padding: 12px 14px; }
      .input-bar { padding: 12px 14px 16px; }
      .input-field { font-size: 14px; }
    }
  </style>
</head>
<body>
  <!-- ─── Nav ─── -->
  <nav class="navbar">
    <div class="nav-brand">
      <div class="nav-logo">🛍</div>
      灵犀导购
    </div>
    <div class="nav-actions">
      <button class="nav-btn btn-ghost" id="btnClear" title="清空对话">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
      </button>
      <button class="nav-btn btn-primary" id="btnNewChat">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        新对话
      </button>
    </div>
  </nav>

  <!-- ─── Main ─── -->
  <div class="main">
    <div class="chat-scroll" id="chatScroll">
      <div class="welcome" id="welcomeScreen">
        <div class="welcome-emoji">🛒</div>
        <h1>嗨，我是灵犀导购</h1>
        <p class="subtitle">不是冷冰冰的机器人。我像你身边那个懂行的朋友，帮你挑到真正适合的东西。</p>
        <div class="suggestion-grid" id="suggestionGrid"></div>
        <div class="feature-row">
          <span class="feature-badge">智能推荐</span>
          <span class="feature-badge">商品对比</span>
          <span class="feature-badge">评价分析</span>
          <span class="feature-badge">营销文案</span>
          <span class="feature-badge">全品类覆盖</span>
          <span class="feature-badge">实时联网</span>
        </div>
      </div>
    </div>

    <!-- ─── Input ─── -->
    <div class="input-bar">
      <div class="input-container">
        <textarea
          class="input-field"
          id="inputField"
          placeholder="告诉我你想买什么，或者有什么购物纠结…"
          rows="1"
        ></textarea>
        <button class="send-button" id="btnSend" aria-label="发送">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
      <p class="input-hint">按 Enter 发送，Shift + Enter 换行</p>
    </div>
  </div>

  <script>
    (function() {
      const chatScroll = document.getElementById('chatScroll');
      const inputField = document.getElementById('inputField');
      const btnSend = document.getElementById('btnSend');
      const btnClear = document.getElementById('btnClear');
      const btnNewChat = document.getElementById('btnNewChat');
      const welcomeScreen = document.getElementById('welcomeScreen');
      const suggestionGrid = document.getElementById('suggestionGrid');

      let isStreaming = false;
      let sessionId = 's_' + Date.now();

      // ─── Markdown renderer ───
      function renderMD(text) {
        if (!text) return '';
        let html = text
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          // Code blocks
          .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
          .replace(/`([^`]+)`/g, '<code>$1</code>')
          // Bold / Italic
          .replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>')
          .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
          .replace(/\*(.+?)\*/g, '<em>$1</em>')
          // Headings
          .replace(/^#### (.+)$/gm, '<h4>$1</h4>')
          .replace(/^### (.+)$/gm, '<h3>$1</h3>')
          .replace(/^## (.+)$/gm, '<h2>$1</h2>')
          .replace(/^# (.+)$/gm, '<h1>$1</h1>')
          // HR
          .replace(/^---$/gm, '<hr>')
          // Blockquote
          .replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>')
          // Tables (simplified — wrap table-like markdown)
          .replace(/\|(.+)\|/g, function(m) {
            if (m.indexOf('---') > -1) return '';
            return '<tr>' + m.split('|').filter(Boolean).map(function(c) {
              return (m.match(/^.+?\|/) ? '<td>' : '<th>') + c.trim() + (m.match(/^.+?\|/) ? '</td>' : '</th>');
            }).join('') + '</tr>';
          })
          // Lists
          .replace(/^[\s]*[-*] (.+)$/gm, '<li>$1</li>')
          .replace(/^[\s]*\d+\. (.+)$/gm, '<li>$1</li>')
          // Line breaks
          .replace(/\n{2,}/g, '</p><p>')
          .replace(/\n/g, '<br>');

        // Wrap adjacent <li>s in <ul>
        html = html.replace(/((?:<li>.*?<\/li><br>?)+)/g, '<ul>$1</ul>');
        // Remove <br> between </li> and <li>
        html = html.replace(/<\/li><br><li>/g, '</li><li>');
        html = html.replace(/<\/ul><br>/g, '</ul>');

        return '<p>' + html + '</p>';
      }

      // ─── Load suggestions ───
      function loadSuggestions() {
        fetch('/api/suggestions')
          .then(function(r) { return r.json(); })
          .then(function(d) {
            const icons = ['🎧','💄','🎁','📱','🍳','💻'];
            suggestionGrid.innerHTML = d.suggestions.map(function(s, i) {
              return '<button class="suggestion-card"><span class="sug-icon">' + (icons[i] || '🛍') +
                '</span>' + s + '</button>';
            }).join('');
            // Bind click events
            suggestionGrid.querySelectorAll('.suggestion-card').forEach(function(btn) {
              btn.addEventListener('click', function() {
                inputField.value = this.textContent.replace(/^\S+\s*/, '').trim();
                sendMessage();
              });
            });
          })
          .catch(function() {});
      }
      loadSuggestions();

      // ─── Event listeners ───
      btnSend.addEventListener('click', sendMessage);
      btnClear.addEventListener('click', clearChat);
      btnNewChat.addEventListener('click', clearChat);

      inputField.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 130) + 'px';
      });

      inputField.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      // ─── Send message ───
      function sendMessage() {
        var message = inputField.value.trim();
        if (!message || isStreaming) return;

        isStreaming = true;
        btnSend.disabled = true;
        inputField.value = '';
        inputField.style.height = 'auto';

        hideWelcome();

        addMessage('user', message);
        var aiMsg = addMessage('ai', '', true);

        fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: message, session_id: sessionId })
        })
        .then(function(res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          var reader = res.body.getReader();
          var decoder = new TextDecoder();
          var fullContent = '';
          var buffer = '';

          function read() {
            return reader.read().then(function(result) {
              if (result.done) {
                finishStream(aiMsg, fullContent);
                return;
              }
              buffer += decoder.decode(result.value, { stream: true });
              var lines = buffer.split('\n');
              buffer = lines.pop() || '';

              for (var i = 0; i < lines.length; i++) {
                var line = lines[i];
                if (line.indexOf('data: ') === 0) {
                  var data = line.slice(6);
                  if (data === '[DONE]') {
                    finishStream(aiMsg, fullContent);
                    return;
                  }
                  try {
                    var parsed = JSON.parse(data);
                    if (parsed.content) {
                      fullContent += parsed.content;
                      updateBubble(aiMsg, fullContent);
                    }
                    if (parsed.error) {
                      updateBubble(aiMsg, '⚠️ ' + parsed.error);
                    }
                  } catch (e) {}
                }
              }
              return read();
            });
          }
          return read();
        })
        .catch(function(err) {
          updateBubble(aiMsg, '⚠️ 网络连接异常，请检查网络后重试。');
          finishStream(aiMsg, '');
        });
      }

      function finishStream(el, content) {
        if (!content && el) {
          updateBubble(el, '抱歉，暂时无法生成回复，请稍后重试。');
        }
        isStreaming = false;
        btnSend.disabled = false;
        inputField.focus();
      }

      // ─── Message helpers ───
      function addMessage(role, content, loading) {
        var row = document.createElement('div');
        row.className = 'msg-row ' + role;

        var avatar = document.createElement('div');
        avatar.className = 'msg-avatar ' + role;
        avatar.textContent = role === 'ai' ? '🛍' : 'U';

        var bubble = document.createElement('div');
        bubble.className = 'msg-bubble';

        if (loading) {
          bubble.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
        } else {
          bubble.innerHTML = content ? renderMD(content) : '';
          if (role === 'user') bubble.textContent = content;
        }

        row.appendChild(role === 'ai' ? avatar : bubble);
        row.appendChild(role === 'ai' ? bubble : avatar);
        chatScroll.appendChild(row);
        scrollDown();
        return row;
      }

      function updateBubble(el, content) {
        var bubble = el.querySelector('.msg-bubble');
        if (bubble) bubble.innerHTML = renderMD(content);
        scrollDown();
      }

      function scrollDown() {
        requestAnimationFrame(function() {
          chatScroll.scrollTop = chatScroll.scrollHeight;
        });
      }

      function hideWelcome() {
        if (welcomeScreen) welcomeScreen.style.display = 'none';
      }

      function clearChat() {
        fetch('/api/chat/' + sessionId, { method: 'DELETE' }).catch(function() {});
        sessionId = 's_' + Date.now();
        var messages = chatScroll.querySelectorAll('.msg-row');
        messages.forEach(function(m) { m.remove(); });
        if (welcomeScreen) {
          welcomeScreen.style.display = '';
          chatScroll.appendChild(welcomeScreen);
        }
        loadSuggestions();
        inputField.focus();
      }
    })();
  </script>
</body>
</html>
